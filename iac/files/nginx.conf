# nginx vor der Web-Konsole: einziger von aussen erreichbarer Dienst (Port 80).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;

  # Versionsabfrage: von tictactest-prepare aus app.env geschrieben (stammt aus dem Release-Tag)
  location = /version.txt {
    root /var/www/tictactest;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    # Frontend liegt auf einer anderen Origin (S3) -> CORS fuer diese oeffentliche Info erlauben
    add_header Access-Control-Allow-Origin "*" always;
  }

  # Alles andere -> ttyd (HTML + WebSocket)
  location / {
    proxy_pass http://127.0.0.1:7681;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
}
