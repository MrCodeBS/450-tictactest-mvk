name: DevContainer CD

on:
  push:
    branches:
      - main
      - master
      - refactor/tictactoe-parameterized-tests
    paths:
      - '.devcontainer/**'

jobs:
  version-and-build:
    name: Build & Push SemVer Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-devcontainer:${{ steps.tag_version.outputs.new_tag }}

  release-gate:
    name: Approve Release (Gate)
    needs: version-and-build
    runs-on: ubuntu-latest
    environment: devcontainer-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag as latest and push
        run: |
          # Lowercase the repository name to match GHCR formatting
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker pull ghcr.io/$REPO-devcontainer:${{ needs.version-and-build.outputs.new_tag }}
          docker tag ghcr.io/$REPO-devcontainer:${{ needs.version-and-build.outputs.new_tag }} ghcr.io/$REPO-devcontainer:latest
          docker push ghcr.io/$REPO-devcontainer:latest

  auto-pr:
    name: Create Auto-PR for Version Bump
    needs: [version-and-build, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version in devcontainer.json
        run: |
          sed -i 's|ghcr.io/mrcodebs/450-tictactest-mvk-devcontainer:.*"|ghcr.io/mrcodebs/450-tictactest-mvk-devcontainer:${{ needs.version-and-build.outputs.new_tag }}"|' .devcontainer/devcontainer.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(devcontainer): bump image to ${{ needs.version-and-build.outputs.new_tag }}"
          title: "Update DevContainer Image to ${{ needs.version-and-build.outputs.new_tag }}"
          body: "Automated PR to update the DevContainer image after a successful release."
          branch: "update-devcontainer-${{ needs.version-and-build.outputs.new_tag }}"
