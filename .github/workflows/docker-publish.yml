name: DevContainer CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.devcontainer/**'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional manual tag (e.g. v1.0.1)'
        required: false
        default: ''

jobs:
  version-and-build:
    name: Build & Push SemVer Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          custom_tag: ${{ github.event.inputs.custom_tag }}
          tag_prefix: v

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare Image Name
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ steps.tag_version.outputs.new_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v1.0.1"
          fi
          echo "IMAGE_TAG=ghcr.io/${REPO}-devcontainer:${TAG}" >> $GITHUB_ENV
          echo "LATEST_TAG=ghcr.io/${REPO}-devcontainer:latest" >> $GITHUB_ENV

      - name: Build and push versioned image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}

  release-gate:
    name: Approve Release (Gate)
    needs: version-and-build
    runs-on: ubuntu-latest
    environment: devcontainer-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Tag as latest and push
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ needs.version-and-build.outputs.new_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v1.0.1"
          fi
          docker pull ghcr.io/${REPO}-devcontainer:${TAG}
          docker tag ghcr.io/${REPO}-devcontainer:${TAG} ghcr.io/${REPO}-devcontainer:latest
          docker push ghcr.io/${REPO}-devcontainer:latest

  auto-pr:
    name: Create Auto-PR for Version Bump
    needs: [version-and-build, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version in devcontainer.json
        run: |
          TAG="${{ needs.version-and-build.outputs.new_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v1.0.1"
          fi
          sed -i -E 's|"image":\s*"[^"]*"|"image": "ghcr.io/'"$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"'-devcontainer:'"$TAG"'"|' .devcontainer/devcontainer.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(devcontainer): bump image to ${{ needs.version-and-build.outputs.new_tag }}"
          title: "Update DevContainer Image to ${{ needs.version-and-build.outputs.new_tag }}"
          body: "Automated PR to update the DevContainer image after a successful release."
          branch: "update-devcontainer-${{ needs.version-and-build.outputs.new_tag }}"
