name: Release

# Nur ein Tag v* erzeugt einen Release und loest ein Deployment aus.
# Ein normaler Push auf main startet nur die CI (ci.yml) und deployt nichts.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Release for Tag: $TAG (Version: $VERSION)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test --no-daemon

      - name: Build Executable JAR
        run: ./gradlew jar -PprojVersion=${{ env.VERSION }} --no-daemon

      - name: Package Frontend
        run: |
          # Frontend ist plain HTML/CSS/JS ohne Build-Step: nur kopieren und Version eintragen.
          # config.js (lokale Defaults) bleibt drin, damit das Archiv lokal sofort laeuft;
          # in der Cloud wird es beim Deployment ausgeschlossen (OpenTofu liefert config.js).
          mkdir -p build/frontend
          cp -r frontend/. build/frontend/
          echo "$VERSION" > build/frontend/version.txt
          (cd build/frontend && zip -r "../libs/tictactest-frontend-$VERSION.zip" .)

      - name: Generate SHA-256 Checksums
        run: |
          cd build/libs
          sha256sum "tictactest-$VERSION.jar" "tictactest-frontend-$VERSION.zip" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Release ${{ env.TAG }}"
          body: |
            ## TicTacTest ${{ env.TAG }}

            Assets:
            - `tictactest-${{ env.VERSION }}.jar` – ausführbares Spiel (Backend)
            - `tictactest-frontend-${{ env.VERSION }}.zip` – statische Webseite (Frontend)
            - `checksums.txt` – SHA-256 der Assets

            ### Lokal starten
            ```bash
            java -jar tictactest-${{ env.VERSION }}.jar
            ```
            Web-Variante: siehe [docs/webkonsole.md](https://github.com/${{ github.repository }}/blob/main/docs/webkonsole.md).

            Siehe [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) für alle Änderungen.
          files: |
            build/libs/tictactest-${{ env.VERSION }}.jar
            build/libs/tictactest-frontend-${{ env.VERSION }}.zip
            build/libs/checksums.txt
          draft: false
          prerelease: false

  changes:
    name: Detect changes since previous release
    runs-on: ubuntu-latest
    needs: release
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # alle Tags + History, sonst gibt es keinen Vorgaenger-Tag

      - name: Compare with previous release tag
        id: diff
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: ./scripts/detect-changes.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Änderungserkennung für ${{ needs.release.outputs.tag }}"
            echo "| Teil | Deploy |"
            echo "|---|---|"
            echo "| Backend | ${{ steps.diff.outputs.backend }} |"
            echo "| Frontend | ${{ steps.diff.outputs.frontend }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: [release, changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      deploy_backend: ${{ needs.changes.outputs.backend == 'true' }}
      deploy_frontend: ${{ needs.changes.outputs.frontend == 'true' }}
    secrets: inherit
