name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    test:
        name: Build & Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Make Gradle Wrapper executable
              run: chmod +x gradlew

            - name: Build and test (includes JaCoCo)
              run: ./gradlew build --no-daemon

            - name: Upload JaCoCo Reports Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: jacoco-reports
                  path: build/reports/jacoco/test/
                  retention-days: 1

    coverage:
        name: Coverage Analysis & Gate
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0

            - name: Download JaCoCo Reports
              uses: actions/download-artifact@v4
              with:
                  name: jacoco-reports
                  path: build/reports/jacoco/test/

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.10'
            
            - name: Install dependencies
              run: pip install matplotlib

            # PR: Coverage Gate
            - name: Run Coverage Gate
              id: gate
              if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
              run: python .github/scripts/coverage_gate.py

            - name: Comment Coverage Gate on PR
              uses: marocchino/sticky-pull-request-comment@v2
              if: github.event_name == 'pull_request' && (success() || failure())
              with:
                  header: coverage-gate
                  message: |
                    ```text
                    ${{ steps.gate.outputs.gate_output }}
                    ```

            # Push: Time Series Chart & Commit
            - name: Generate Coverage Chart & History
              if: github.event_name == 'push'
              run: |
                  python .github/scripts/update_coverage.py
                  echo "### JaCoCo Coverage History" >> $GITHUB_STEP_SUMMARY
                  echo "![Coverage Chart](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/coverage-chart.png)" >> $GITHUB_STEP_SUMMARY

            - name: Commit Coverage History
              if: github.event_name == 'push'
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "chore: update coverage history and chart"
                  file_pattern: '.github/coverage-history.csv .github/coverage-chart.png'

            # Prepare HTML Report
            - name: Prepare Pages Content
              if: github.event_name == 'push'
              run: |
                  cp .github/coverage-history.csv build/reports/jacoco/test/html/ || true
                  cp .github/coverage-chart.png build/reports/jacoco/test/html/ || true
                  sed -i 's|</div><h1>|</div><h2>Coverage History</h2><img src="coverage-chart.png" alt="Coverage History" style="max-width:800px; margin-bottom: 20px;"><hr><h1>|g' build/reports/jacoco/test/html/index.html

            - name: Upload JaCoCo HTML Report Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: jacoco-html-report
                  path: build/reports/jacoco/test/html/

            # Setup & Upload Pages Artifact
            - name: Setup GitHub Pages
              uses: actions/configure-pages@v4
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  path: build/reports/jacoco/test/html/

    deploy:
        name: Deploy to GitHub Pages
        needs: coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            pages: write      
            id-token: write   
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4