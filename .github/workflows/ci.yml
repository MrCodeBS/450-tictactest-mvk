name: CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        
        # Erforderliche Rechte für PR-Kommentare und das native GitHub Pages Deployment
        permissions:
            contents: write
            pull-requests: write
            pages: write      
            id-token: write   

        # Notwendig für das native GitHub Pages Deployment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Make Gradle Wrapper executable
              run: chmod +x gradlew

            - name: Build and test (includes JaCoCo)
              run: ./gradlew build --no-daemon

            # 1. Report als Kommentar in Pull Requests (nur bei PRs)
            - name: Add Coverage to PR
              uses: madrapps/jacoco-report@v1.6.1
              if: github.event_name == 'pull_request'
              with:
                  paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
                  token: ${{ secrets.GITHUB_TOKEN }}
                  min-coverage-overall: 40
                  min-coverage-changed-files: 60
                  title: 📊 JaCoCo Code Coverage

            # 2. HTML-Report als normales Artefakt speichern (immer)
            - name: Upload JaCoCo HTML Report Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: jacoco-html-report
                  path: build/reports/jacoco/test/html/

            # 3. Vorbereitung für GitHub Pages (Nativ)
            - name: Setup GitHub Pages
              uses: actions/configure-pages@v4
              if: github.event_name == 'push'

            # 4. Artefakt für GitHub Pages hochladen (Jeder Branch Push)
            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              if: github.event_name == 'push'
              with:
                  path: build/reports/jacoco/test/html/

            # 5. Auf GitHub Pages deployen (Jeder Branch Push)
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
              if: github.event_name == 'push'